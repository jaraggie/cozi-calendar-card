# Example full-width dashboard. Replace the fictional entity and member names.
views:
  - title: Family
    path: family
    type: panel
    cards:
      - type: custom:cozi-calendar-card
        entity: calendar.family_cozi
        title: Family calendar
        initial_view: month
        days_to_show: 7
