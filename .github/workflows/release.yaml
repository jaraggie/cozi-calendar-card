name: Prepare draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag matching package.json (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$DISPATCH_REF" == "refs/tags/$RELEASE_TAG" ]] || {
            echo "Dispatch this workflow using the candidate tag as its ref."
            exit 1
          }
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm run check
      - run: npm test
      - run: npm run release:check
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      # HACS validates the remote repository using its own release/branch
      # selection. This checks repository compatibility, not candidate assets.
      - name: Validate remote HACS repository
        uses: hacs/action@main
        with:
          category: plugin
          comment: false

  draft:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python3 scripts/package_release.py
      - name: Create draft with reviewed version assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG" release/cozi-calendar-card.js
          release/cozi-calendar-card-*.zip release/SHA256SUMS
          --verify-tag --draft --title "$RELEASE_TAG" --notes-file CHANGELOG.md
