name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm run check
      - run: npm test
      - run: npm run release:check
      - run: python3 scripts/package_release.py

  hacs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate HACS dashboard repository
        uses: hacs/action@main
        with:
          category: plugin
          comment: false
