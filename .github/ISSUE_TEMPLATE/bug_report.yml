name: Bug report
description: Report a problem with the card using fictional or redacted event data.
body:
  - type: markdown
    attributes:
      value: "Please exclude calendar subscription URLs, credentials, and private appointment details. The card is independent of Cozi and Home Assistant."
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Card version, Home Assistant version, browser/device, and installation method.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Redacted card configuration and fictional event example
      render: yaml
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshot or browser console error
